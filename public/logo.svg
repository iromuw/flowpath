<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Flowpath">
  <title>Flowpath</title>

  <!-- Rounded square background -->
  <rect width="200" height="200" rx="36" fill="#0D2B24"/>

  <!--
    Proportions matched to reference:
    - Top arm: narrow rectangle, diagonal cut at bottom-right (small cut angle)
    - Gap between top arm and mid section
    - Lower block: left vertical stem + mid arm parallelogram as one connected L-shape
    - Mid arm arrow points right with steeper diagonal
  -->

  <!-- Top arm: narrow trapezoid, right side cuts down-left gently -->
  <polygon points="30,30 172,30 172,74 100,74" fill="#1D9E75"/>

  <!-- Lower block -->
 <polygon points="30,174 30,84 172,84 120,130 90,130 90,174" fill="#1D9E75"/>

</svg>